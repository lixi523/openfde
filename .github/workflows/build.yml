name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  DOTNET_VERSION: '8.0.x'

jobs:
  build-cli:
    name: Build OpenFDE CLI (Windows only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      # pnpm 11 requires explicit opt-in for native-module build scripts
      # (better-sqlite3, esbuild). Appending to global ~/.npmrc is the
      # documented approach after pnpm/action-setup initializes PNPM_HOME.
      - run: echo "dangerouslyAllowAllBuildScripts=true" >> ~/.npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Package CLI as Windows .zip (with .cmd shim)
        run: |
          mkdir -p dist
          cd apps/cli
          mkdir -p artifacts/cli-win
          cp -r dist artifacts/cli-win/
          cp package.json artifacts/cli-win/
          cat > artifacts/cli-win/openfde.cmd <<'EOF'
          @echo off
          setlocal
          set "SCRIPT_DIR=%~dp0"
          node "%SCRIPT_DIR%dist\index.js" %*
          EOF
          cd ../..
          cd apps/cli/artifacts/cli-win && zip -r ../../../dist/openfde-cli-win.zip . && cd ../../../..

      - uses: actions/upload-artifact@v4
        with:
          name: openfde-cli
          path: dist/openfde-cli-win.zip

  build-tray:
    name: Build Windows Tray Launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish framework-dependent (164 KB, needs .NET 8 Desktop Runtime)
        run: |
          cd apps/tray
          dotnet publish -c Release --self-contained false -r win-x64 `
            -p:PublishSingleFile=true `
            -p:InvariantGlobalization=true `
            -p:StackTraceSupport=false `
            -o ./publish
          if (Test-Path ./publish/OpenFDE.exe) {
            Rename-Item ./publish/OpenFDE.exe OpenFDE.Tray.exe -Force
          }
          if (Test-Path ./publish/OpenFDE.Tray.exe) {
            Write-Output "Tray (fw-dependent): $((Get-Item ./publish/OpenFDE.Tray.exe).Length) bytes"
          }

      - name: Publish self-contained (147 MB, no runtime needed)
        run: |
          cd apps/tray
          dotnet publish -c Release --self-contained true -r win-x64 `
            -p:PublishSingleFile=true `
            -p:InvariantGlobalization=true `
            -p:StackTraceSupport=false `
            -o ./publish-full

      - uses: actions/upload-artifact@v4
        with:
          name: openfde-tray-fw-depend
          path: apps/tray/publish/OpenFDE.Tray.exe

      - uses: actions/upload-artifact@v4
        with:
          name: openfde-tray-self-contained
          path: apps/tray/publish-full/OpenFDE.exe

  release:
    name: Create GitHub Release
    needs: [build-cli, build-tray]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release from tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/openfde-cli/openfde-cli-win.zip
            artifacts/openfde-tray-fw-depend/OpenFDE.Tray.exe
            artifacts/openfde-tray-self-contained/OpenFDE.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
